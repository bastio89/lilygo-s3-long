; LilyGo T-Display-S3 Long  ->  Flexispot / LoctekMotion Schreibtisch-Steuerung
; https://github.com/bastio89/lilygo-s3-long

[platformio]
default_envs = t-display-s3-long
boards_dir   = boards

; ---------------------------------------------------------------- Firmware ---
[env:t-display-s3-long]
platform         = espressif32@6.5.0
board            = T-Display-Long
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600

board_build.partitions = default_16MB.csv

build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -I include
    -I src
build_unflags =
    -std=gnu++11

lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^7.0.4

; ------------------------------------------------------- Host-Unit-Tests -----
; Reines Protokoll-/Logik-Testing ohne Hardware:  pio test -e native
[env:native]
platform  = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I include
    -I src
build_src_filter = +<desk/protocol.cpp> +<desk/flexispot.cpp> +<desk/presets.cpp>
