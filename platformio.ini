; LilyGo T-Display-S3 Long  ->  Flexispot / LoctekMotion Schreibtischsteuerung
; https://github.com/bastio89/lilygo-s3-long

[platformio]
default_envs = t-display-s3-long
boards_dir   = boards

; --------------------------------------------------------- Gemeinsame Basis ---
; Kein [env]-Abschnitt: der wuerde auch fuer die nativen Tests gelten.
[esp32_base]
platform         = espressif32@6.5.0
board            = T-Display-Long
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600

board_build.partitions = default_16MB.csv

build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -I include
    -I src
build_unflags =
    -std=gnu++11

lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------- Firmware ---
[env:t-display-s3-long]
extends = esp32_base

; ------------------------------------------------------------ Mithoer-Modus ---
; Gibt alles, was von der Steuerbox hereinkommt, auf der USB-Konsole aus.
; Fuer die erste Verkabelung:  pio run -e sniffer -t upload && pio device monitor
[env:sniffer]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDESK_SNIFFER=1

; ------------------------------------------------------- Host-Unit-Tests -----
; Protokoll und Ablauflogik ohne Hardware:  pio test -e native
[env:native]
platform  = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I include
    -I src
build_src_filter = +<desk/protocol.cpp> +<desk/flexispot.cpp> +<desk/presets.cpp>
